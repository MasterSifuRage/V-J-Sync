# Chạy production local: cp .env.production.example .env.production && docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vjsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vjsync}
      POSTGRES_DB: ${POSTGRES_DB:-vjsync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-vjsync} -d ${POSTGRES_DB:-vjsync}']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - '${APP_PORT:-3001}:3001'
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      SERVE_FRONTEND: '1'
      HOST: 0.0.0.0
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-vjsync}:${POSTGRES_PASSWORD:-vjsync}@db:5432/${POSTGRES_DB:-vjsync}?schema=public
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/backend/uploads

volumes:
  pgdata:
  uploads:

<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tạo Nhắc nhở - V/J Sync</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root { --primary: #1e40af; --text-main: #1e2937; --text-muted: #64748b; --border-color: #e2e8f0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f8fafc; min-height: 100vh; display: flex; }

    .sidebar { width: 280px; background: white; box-shadow: 2px 0 20px rgba(0,0,0,0.08); padding: 24px 0; height: 100vh; position: fixed; z-index: 100; }
    .logo-container { display: flex; align-items: center; gap: 12px; padding: 0 24px 32px; border-bottom: 1px solid var(--border-color); }
    .logo-container img { width: 52px; height: 52px; border-radius: 14px; }
    .logo-container span { font-size: 26px; font-weight: 700; color: var(--primary); }
    .nav-menu { padding: 20px 16px; }
    .nav-item { display: flex; align-items: center; gap: 14px; padding: 14px 20px; margin: 6px 8px; border-radius: 12px; color: #475569; text-decoration: none; font-weight: 500; transition: 0.3s; }
    .nav-item:hover, .nav-item.active { background: #f1f5f9; color: var(--primary); }
    .nav-item i { font-size: 20px; width: 24px; }

    /* Bỏ max-width ở đây để full màn hình */
    .main-content { margin-left: 280px; flex: 1; padding: 32px 40px; }
    
    .breadcrumb { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .breadcrumb a { color: var(--primary); text-decoration: none; font-weight: 500; }
    .header h1 { font-size: 28px; font-weight: 700; color: var(--text-main); margin-bottom: 32px; }

    /* Layout 2 cột giống trang Task */
    .form-layout { display: grid; grid-template-columns: 2fr 1fr; gap: 32px; align-items: start; }
    .card { background: white; border-radius: 16px; padding: 32px; border: 1px solid var(--border-color); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
    
    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 14px; font-weight: 600; color: var(--text-main); margin-bottom: 8px; }
    input[type="text"], input[type="time"], input[type="date"], select, textarea { width: 100%; padding: 12px 16px; border: 2px solid var(--border-color); border-radius: 10px; font-size: 15px; font-family: inherit; outline: none; transition: 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .tz-alert { background: #fffbeb; border: 1px solid #fde68a; padding: 12px 16px; border-radius: 10px; font-size: 13px; color: #92400e; display: flex; align-items: center; gap: 10px; margin-top: 8px; }

    .btn-group { display: flex; gap: 16px; margin-top: 32px; justify-content: flex-end; }
    .btn { padding: 12px 24px; border-radius: 10px; font-weight: 600; font-size: 15px; cursor: pointer; border: none; width: 100%; transition: 0.2s; }
    .btn-cancel { background: white; border: 2px solid var(--border-color); color: var(--text-muted); }
    .btn-cancel:hover { background: #f1f5f9; color: var(--text-main); }
    .btn-submit { background: var(--primary); color: white; }
    .btn-submit:hover { background: #1e3a8a; }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="logo-container"><img src="vj-logo.png" alt="Logo"><span>V/J Sync</span></div>
    <div class="nav-menu">
      <a href="home.html" class="nav-item"><i class="fas fa-home"></i> Trang chủ</a>
      <a href="chat.html" class="nav-item"><i class="fas fa-comments"></i> Chat</a>
      <a href="task-list.html" class="nav-item"><i class="fas fa-tasks"></i> Công việc</a>
      <a href="remind-list.html" class="nav-item active"><i class="fas fa-bell"></i> Nhắc nhở</a>
      <a href="workspace-select.html" class="nav-item"><i class="fas fa-building"></i> Workspace</a>
      <a href="settings.html" class="nav-item"><i class="fas fa-cog"></i> Cài đặt</a>
    </div>
  </div>

  <div class="main-content">
    <div class="breadcrumb"><a href="remind-list.html">Nhắc nhở</a> <i class="fas fa-chevron-right" style="font-size: 10px;"></i> <span>Tạo mới</span></div>
    <div class="header"><h1>Thiết lập Nhắc nhở</h1></div>

    <div class="form-layout">
      <div class="card">
        <div class="form-group">
          <label>Nội dung lời nhắc</label>
          <textarea rows="4" placeholder="Ví dụ: Đã đến giờ gửi báo cáo hàng ngày..."></textarea>
          <label style="display:flex; align-items:center; gap:8px; margin-top:16px; font-weight:500; color:#1e40af; cursor:pointer;">
            <input type="checkbox" checked style="width:16px;height:16px;">
            Tự động gửi kèm bản dịch Tiếng Nhật
          </label>
        </div>

        <div class="grid-2">
          <div class="form-group">
            <label>Thời gian</label>
            <input type="time" value="09:00">
          </div>
          <div class="form-group">
            <label>Múi giờ tham chiếu</label>
            <select>
              <option>Giờ Việt Nam (ICT, UTC+7)</option>
              <option selected>Giờ Nhật Bản (JST, UTC+9)</option>
            </select>
          </div>
        </div>
        <div class="tz-alert"><i class="fas fa-exclamation-circle"></i> Sẽ kích hoạt vào 07:00 AM theo giờ Việt Nam của bạn.</div>
      </div>

      <div class="card" style="background: #f8fafc;">
        <div class="form-group">
          <label>Tần suất lặp lại</label>
          <select>
            <option>Chỉ một lần</option>
            <option selected>Hàng ngày (T2 - T6)</option>
            <option>Hàng tuần</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>Gửi thông báo tới</label>
          <select>
            <option>Chỉ mình tôi (Ghi chú cá nhân)</option>
            <option>Kênh: #jp-vn-bridge</option>
            <option>Người dùng: Tanaka Sato</option>
          </select>
        </div>

        <div class="btn-group" style="flex-direction: column; gap: 12px; margin-top: 40px;">
          <button class="btn btn-submit" onclick="window.location.href='remind-list.html'">Lưu lời nhắc</button>
          <button class="btn btn-cancel" onclick="window.history.back()">Hủy bỏ</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

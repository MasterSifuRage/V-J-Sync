<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - V/J Sync</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e0f2fe 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .login-container {
      background: white;
      width: 420px;
      border-radius: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      padding: 50px 40px;
      text-align: center;
    }
    
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      font-size: 28px;
      font-weight: 700;
      color: #1e40af;
    }
    
    .logo img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(30, 64, 175, 0.3);
      background: white;
      padding: 6px;
    }
    
    h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      color: #1e2937;
    }
    
    p {
      color: #64748b;
      margin-bottom: 40px;
    }
    
    .input-group {
      margin-bottom: 20px;
      text-align: left;
    }
    
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #334155;
    }
    
    input {
      width: 100%;
      padding: 14px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      transition: all 0.3s;
    }
    
    input:focus {
      border-color: #3b82f6;
      outline: none;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }
    
    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0 25px;
      font-size: 14px;
    }
    
    .btn-login {
      width: 100%;
      padding: 16px;
      background: #1e40af;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.3s;
    }
    
    .btn-login:hover {
      background: #1e3a8a;
      transform: translateY(-2px);
    }
    
    .divider {
      margin: 25px 0;
      color: #94a3b8;
      font-size: 14px;
    }
    
    .btn-google {
      width: 100%;
      padding: 14px;
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    
    .switch-link {
      margin-top: 25px;
      color: #64748b;
    }
    
    .switch-link a {
      color: #3b82f6;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="logo">
      <img src="vj-logo.png" alt="V/J Sync Logo">
      <span>V/J Sync</span>
    </div>
    
    <h1>Đăng nhập</h1>
    <p>Chào mừng bạn trở lại với V/J Sync</p>
    
    <div class="input-group">
      <label>Email hoặc tên đăng nhập</label>
      <input type="email" placeholder="example@company.com" required>
    </div>
    
    <div class="input-group">
      <label>Mật khẩu</label>
      <input type="password" placeholder="••••••••" required>
    </div>
    
    <div class="options">
      <label><input type="checkbox" checked> Ghi nhớ đăng nhập</label>
      <a href="#" style="color:#3b82f6; text-decoration:none;">Quên mật khẩu?</a>
    </div>
    
    <button class="btn-login">Đăng nhập</button>
    
    <div class="divider">hoặc</div>
    
    <button class="btn-google">
      <span>🔵</span> Đăng nhập bằng Google
    </button>
    
    <div class="switch-link">
      Chưa có tài khoản? <a href="#" onclick="window.location.href='register.html'">Đăng ký ngay</a>
    </div>
  </div>

</body>
</html>
